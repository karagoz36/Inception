services:
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    env_file: .env
    secrets:
      - mysql_password
      - mysql_root_password
    networks:
      - inception-network
    volumes:
      - mariadb_data:/var/lib/mysql
    pull_policy: never
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$(cat /run/secrets/mysql_root_password)"]
      interval: 15s
      timeout: 5s
      retries: 5

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    networks:
      - inception-network
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - mariadb
      - redis
      - adminer
    secrets:
      - mysql_password
      - mysql_root_password
      - wp_admin_password
      - wp_user_password
    env_file: .env
    pull_policy: never
    restart: unless-stopped


  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "443:443"
    networks:
      - inception-network
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - wordpress
      - static-website
      - adminer
    pull_policy: never
    restart: unless-stopped

  # Bonus

  redis:
    build:
      context: ./bonus/redis
      dockerfile: Dockerfile
    container_name: redis
    env_file: .env
    networks:
      - inception-network
    pull_policy: never
    restart: unless-stopped

  ftp:
    container_name: ftp
    build:
      context: ./bonus/ftp
      dockerfile: Dockerfile
    env_file:
      - .env
    secrets:
      - ftp_password
    networks:
      - inception-network
    volumes:
      - wordpress_data:/var/www/html
    ports:
      - "21-21:21-21"
      - "20000-20100:20000-20100"
    pull_policy: never
    restart: unless-stopped

  static-website:
    build:
      context: ./bonus/static-website
      dockerfile: Dockerfile
    container_name: static-website
    networks:
      - inception-network
    volumes:
      - wordpress_data:/var/www/html
    pull_policy: never

  adminer:
    build:
      context: ./bonus/adminer
      dockerfile: Dockerfile
    container_name: adminer
    networks:
      - inception-network
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - mariadb
    restart: unless-stopped


  prometheus:
    build:
      context: ./bonus/prometheus
      dockerfile: Dockerfile
    container_name: prometheus
    networks:
      - inception-network
    volumes:
      - prometheus_data:/tmp/prometheus
    pull_policy: never
    restart: unless-stopped

  node-exporter:
    build:
      context: ./bonus/node-exporter
      dockerfile: Dockerfile
    container_name: node-exporter
    networks:
      - inception-network
    # Host metriklerini doğru şekilde okuyabilmek için /proc ve /sys gibi 
    # mountlar ekleyebilirsiniz (örnek aşağıda):
    # volumes:
    #   - /proc:/host/proc:ro
    #   - /sys:/host/sys:ro
    # command:
    #   - '--path.procfs=/host/proc'
    #   - '--path.sysfs=/host/sys'
    pull_policy: never
    restart: unless-stopped

  grafana:
    build:
      context: ./bonus/grafana
      dockerfile: Dockerfile
    container_name: grafana
    networks:
      - inception-network
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    secrets:
      - grafana_admin_password
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
    restart: unless-stopped
    pull_policy: never


secrets:
  mysql_password:
    file: ../secrets/mysql_password.txt
  mysql_root_password:
    file: ../secrets/mysql_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
  grafana_admin_password:
    file: ../secrets/grafana_admin_password.txt


networks:
  inception-network:
    driver: bridge
    

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/data/wordpress_data
      o: bind

  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/data/mariadb_data
      o: bind

  static_data:
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/data/static_data
      o: bind

  prometheus_data:
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/data/prometheus_data
      o: bind

  grafana_data:
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/data/grafana_data
      o: bind
