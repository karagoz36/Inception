<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Recipe Book</h1>
    </header>
    <main>
        <section class="gallery">
            <div class="recipe-item">
                <img src="images/recipe1.jpg" alt="Spaghetti">
                <p>Spaghetti Bolognese</p>
                <button onclick="showRecipe(1)">Cook it!</button>
            </div>
            <div class="recipe-item">
                <img src="images/recipe2.jpg" alt="Pancakes">
                <p>Classic Pancakes</p>
                <button onclick="showRecipe(2)">Cook it!</button>
            </div>
            <div class="recipe-item">
                <img src="images/recipe3.jpg" alt="Salad">
                <p>Fresh Garden Salad</p>
                <button onclick="showRecipe(3)">Cook it!</button>
            </div>
        </section>
        <section id="recipe-display" class="recipe-display"></section>
    </main>
    <footer>
        <p>&copy; 2024 Recipe Book</p>
    </footer>
</body>
</html>
