global:
  scrape_interval: 15s  # Metricleri her 15 saniyede bir çek

scrape_configs:
  # Prometheus'un kendisini izlemesi (localhost:9090)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']



